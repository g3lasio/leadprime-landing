    <script type="application/ld+json">
    {

      "@type": "FAQPage",

        {
          "@type": "Question",
          "name": "What is LeadPrime?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LeadPrime is an AI-powered CRM built specifically for Contractors, Property Managers, Investors, Realtors, Lenders, and Wholesalers. It automates lead follow-up, manages campaigns across SMS, email, and voice, and connects professionals through the LeadPrime Network."
          }
        },
        {
          "@type": "Question",
          "name": "How much does LeadPrime cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LeadPrime starts at $0/month with the Pay-As-You-Go plan, which includes $15 in welcome credits — no credit card required. LeadPrime Pro is $15/month with $20 in monthly credits. The Network Elite plan is $249/month with $250 in monthly credits and includes full B2B network access, the OWL FENC Suite, business financing access, and more."
          }
        },
        {
          "@type": "Question",
          "name": "What is the LeadPrime Network?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The LeadPrime Network is a B2B network connecting license-verified Contractors, Property Managers, and Investors nationwide — with network access for Lenders, Wholesalers, and Realtors. Members can pursue government and residential project opportunities and access business financing."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Founding Member program?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The first 100 members per city earn the Founding Member badge for life, priority placement in the network, and locked-in pricing forever. Getting started is free with the $0 Pay-As-You-Go plan — no credit card required."
          }
        }

    }
